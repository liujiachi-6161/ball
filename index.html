<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>✨ 捕光者 · 星空小游戏</title>

<!-- ① 尽早判断设备，避免样式闪一下 -->
<script>
  window.__isMobileUA = function () {
    var ua = navigator.userAgent || '';
    var isIPad = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
    var isMobileUA = /Android|iPhone|iPod|iPad|Windows Phone|BlackBerry|IEMobile|Opera Mini|Mobile|HarmonyOS/i.test(ua);
    var isSmallCoarse = window.matchMedia
      ? window.matchMedia('(max-width: 820px) and (pointer: coarse)').matches
      : false;
    return isMobileUA || isIPad || isSmallCoarse;
  };
  (function () {
    var p = new URLSearchParams(location.search).get('layout');
    var stored = null;
    try { stored = sessionStorage.getItem('ball_layout'); } catch (e) {}
    var m;
    if (p === 'mobile') m = true;
    else if (p === 'desktop') m = false;
    else if (stored === 'mobile') m = true;
    else if (stored === 'desktop') m = false;
    else m = window.__isMobileUA();
    if (m) document.documentElement.classList.add('is-mobile');
  })();
</script>

<style>
  /* ============ 公共 ============ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: radial-gradient(circle at center, #0a0f2a 0%, #030514 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    touch-action: manipulation;
  }
  .game-wrapper {
    background: rgba(18, 25, 55, 0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 3rem 3rem 2rem 2rem;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #5f7fff33, 0 0 30px #3b5bdb55;
    border: 1px solid #8ab2ff;
    margin: auto;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: radial-gradient(circle at 30% 30%, #1a2444, #0b1025);
    border-radius: 28px;
    box-shadow: inset 0 0 35px #00000066, 0 0 25px #3c5eff44;
    border: 2px solid #aac3ff;
    cursor: crosshair;
    touch-action: none;
  }
  .info-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111a33d9;
    border-radius: 60px;
    border: 1px solid #6f8bff;
    color: #f0f6ff;
    font-weight: 500;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .score-box {
    background: #1e2f5e;
    border-radius: 40px;
    font-weight: 700;
    color: #d7e6ff;
    text-shadow: 0 0 12px #4a7dff;
    box-shadow: inset 0 2px 5px #00000055, 0 4px 10px #00000033;
  }
  .timer-box {
    background: #1a2749;
    border-radius: 40px;
    font-weight: 600;
    display: flex;
    align-items: center;
    box-shadow: inset 0 2px 5px #00000044;
  }
  .timer-icon { line-height: 1; }
  .btn-restart {
    background: #2b3f7e;
    color: white;
    font-weight: 600;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 5px 0 #0d1730, 0 8px 15px #00000055;
    display: flex;
    align-items: center;
    border: 1px solid #87a6ff;
    font-family: inherit;
  }
  .btn-restart:hover {
    background: #3e5ac0;
    transform: translateY(-3px);
    box-shadow: 0 8px 0 #0d1730, 0 12px 20px #00000066;
  }
  .btn-restart:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d1730; }
  .message {
    color: #ffda7c;
    font-weight: 500;
    text-shadow: 0 0 8px #ffbb33aa;
    text-align: center;
  }
  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    color: #7b92d9;
    opacity: 0.85;
  }
  .btn-layout {
    background: #1a2749;
    border: 1px solid #4d6bd4;
    color: #9db4f0;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-layout:hover { background: #2b3f7e; color: #dbe6ff; }

  /* ============ 桌面版（默认） ============ */
  body { padding: 0; }
  .game-wrapper { padding: 1.5rem 2rem 2rem; max-width: 92vw; }
  canvas {
    width: 600px;
    height: auto;
    aspect-ratio: 600 / 400;
    max-width: 100%;
  }
  .info-panel { margin-top: 1.2rem; padding: 0.4rem 1.2rem; letter-spacing: 0.5px; }
  .score-box { padding: 0.4rem 1.5rem; font-size: 1.5rem; }
  .timer-box { padding: 0.3rem 1.8rem; font-size: 1.3rem; gap: 0.6rem; }
  .timer-icon { font-size: 1.6rem; }
  .btn-restart { font-size: 1.1rem; padding: 0.5rem 1.8rem; letter-spacing: 1px; gap: 6px; }
  .message { font-size: 1.2rem; width: 90px; }
  footer { margin-top: 1rem; font-size: 0.8rem; }
  .btn-layout { font-size: 0.72rem; padding: 0.25rem 0.7rem; }

  /* ============ 移动版（html.is-mobile 覆盖） ============ */
  html.is-mobile body { padding: 12px 8px; }
  html.is-mobile .game-wrapper {
    padding: 1rem 1rem 1.5rem;
    width: 100%;
    max-width: 640px;
  }
  html.is-mobile canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 600 / 400;
  }
  html.is-mobile .info-panel {
    margin-top: 1rem;
    padding: 0.4rem 0.6rem;
    letter-spacing: 0.3px;
    gap: 6px;
    flex-wrap: wrap;
  }
  html.is-mobile .score-box { padding: 0.3rem 0.8rem; font-size: 1.2rem; }
  html.is-mobile .timer-box { padding: 0.3rem 0.8rem; font-size: 1.1rem; gap: 0.4rem; }
  html.is-mobile .timer-icon { font-size: 1.3rem; }
  html.is-mobile .btn-restart { font-size: 0.95rem; padding: 0.4rem 1rem; letter-spacing: 0.5px; gap: 4px; }
  html.is-mobile .message { font-size: 1rem; width: 70px; }
  html.is-mobile footer { margin-top: 0.8rem; font-size: 0.7rem; }
  html.is-mobile .btn-layout { font-size: 0.65rem; padding: 0.2rem 0.55rem; }
</style>
</head>
<body>

<div class="game-wrapper">
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <div class="info-panel">
    <div class="score-box"><span id="scoreDisplay">0</span></div>
    <div class="timer-box">
      <span class="timer-icon">⏳</span>
      <span id="timerDisplay">30</span>
    </div>
    <button class="btn-restart" id="restartBtn">⟳ 重启</button>
    <div id="stateMessage" class="message">🎯 捕捉光</div>
  </div>

  <footer>
    <span>✨ 点击光球得分 · 时间归零结束 ✨</span>
    <button class="btn-layout" id="layoutToggle">📱 移动版</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、布局识别 + 手动切换
     ========================================================= */
  var LAYOUT_KEY = 'ball_layout';
  var urlLayout = new URLSearchParams(location.search).get('layout');

  var isMobileLayout;
  if (urlLayout === 'mobile') {
    isMobileLayout = true;
  } else if (urlLayout === 'desktop') {
    isMobileLayout = false;
  } else {
    var stored = null;
    try { stored = sessionStorage.getItem(LAYOUT_KEY); } catch (e) {}
    if (stored === 'mobile') isMobileLayout = true;
    else if (stored === 'desktop') isMobileLayout = false;
    else isMobileLayout = window.__isMobileUA();
  }

  var layoutToggle = document.getElementById('layoutToggle');

  function applyLayout() {
    document.documentElement.classList.toggle('is-mobile', isMobileLayout);
    layoutToggle.textContent = isMobileLayout ? '🖥 桌面版' : '📱 移动版';
    layoutToggle.title = isMobileLayout ? '切换到桌面版布局' : '切换到移动版布局';
  }

  layoutToggle.addEventListener('click', function (e) {
    e.preventDefault();
    isMobileLayout = !isMobileLayout;
    try { sessionStorage.setItem(LAYOUT_KEY, isMobileLayout ? 'mobile' : 'desktop'); } catch (err) {}
    applyLayout();
  });

  applyLayout();

  /* =========================================================
     二、游戏本体
     ========================================================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreSpan = document.getElementById('scoreDisplay');
  const timerSpan = document.getElementById('timerDisplay');
  const stateMsg = document.getElementById('stateMessage');
  const restartBtn = document.getElementById('restartBtn');

  const GAME_DURATION = 30;
  const BALL_RADIUS = 14;
  const MAX_BALLS = 5;
  const SPAWN_INTERVAL = 450;
  const BALL_LIFETIME = 4500;

  let score = 0;
  let timeLeft = GAME_DURATION;
  let gameActive = false;
  let gameOver = false;
  let balls = [];

  let lastTimestamp = 0;
  let deltaTime = 0;
  let spawnTimer = 0;
  let countdownTimer = 0;
  let animationId = null;

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function createBall() {
    const x = randomInt(BALL_RADIUS + 2, canvas.width - BALL_RADIUS - 2);
    const y = randomInt(BALL_RADIUS + 2, canvas.height - BALL_RADIUS - 2);
    const hue = randomInt(0, 360);
    return {
      x: x,
      y: y,
      radius: BALL_RADIUS,
      color: 'hsl(' + hue + ', 95%, 70%)',
      glow: 'hsl(' + hue + ', 100%, 75%)',
      bornAt: performance.now(),
      phase: Math.random() * Math.PI * 2
    };
  }

  function endGame() {
    gameActive = false;
    gameOver = true;
    stateMsg.textContent = '⏰ 时间到';
    stateMsg.style.color = '#ff6b6b';
  }

  function update(deltaMs) {
    if (!gameActive || gameOver) return;

    countdownTimer += deltaMs;
    if (countdownTimer >= 1000) {
      const secondsToSubtract = Math.floor(countdownTimer / 1000);
      timeLeft = Math.max(0, timeLeft - secondsToSubtract);
      countdownTimer -= secondsToSubtract * 1000;
      timerSpan.textContent = timeLeft;
      if (timeLeft <= 0) { endGame(); return; }
    }

    spawnTimer += deltaMs;
    if (spawnTimer >= SPAWN_INTERVAL && balls.length < MAX_BALLS) {
      balls.push(createBall());
      spawnTimer -= SPAWN_INTERVAL;
    }

    const now = performance.now();
    balls = balls.filter(function (ball) {
      return (now - ball.bornAt) < BALL_LIFETIME;
    });
  }

  function drawStars() {
    const starCount = 70;
    const now = performance.now();
    for (let i = 0; i < starCount; i++) {
      const seed = i * 17;
      const x = (seed * 13 % canvas.width + i * 29) % canvas.width;
      const y = (seed * 7 % canvas.height + i * 31) % canvas.height;
      const brightness = 0.4 + 0.6 * Math.abs(Math.sin(now * 0.001 + i));
      ctx.beginPath();
      ctx.arc(x, y, 1 + i % 3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 240, 200, ' + (brightness * 0.8) + ')';
      ctx.fill();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();

    const now = performance.now();

    for (let i = 0; i < balls.length; i++) {
      const ball = balls[i];
      const age = now - ball.bornAt;
      const lifeRatio = Math.max(0, 1 - age / BALL_LIFETIME);

      ctx.shadowColor = ball.glow;
      ctx.shadowBlur = 25 + 5 * Math.sin(now * 0.005 + ball.phase);
      ctx.beginPath();
      ctx.arc(ball.x, ball.y,
        ball.radius * (0.9 + 0.1 * Math.sin(now * 0.01 + ball.phase)),
        0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();

      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fill();

      ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(255,255,220,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y,
        ball.radius + 2 + Math.sin(now * 0.008 + ball.phase) * 1.5,
        0, Math.PI * 2);
      ctx.stroke();

      if (lifeRatio < 0.3) {
        ctx.globalAlpha = lifeRatio * 3.5;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 28px "Segoe UI", sans-serif';
      ctx.fillStyle = '#f0d9ff';
      ctx.shadowColor = '#aa88ff';
      ctx.shadowBlur = 18;
      ctx.textAlign = 'center';
      ctx.fillText('✨ 游戏结束 ✨', canvas.width / 2, canvas.height / 2 - 20);

      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#cfd8ff';
      ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 + 25);
      ctx.shadowBlur = 0;
    }
  }

  /* 统一坐标处理：鼠标 & 触摸都走这里 */
  function handlePoint(clientX, clientY) {
    if (!gameActive || gameOver) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mouseX = (clientX - rect.left) * scaleX;
    const mouseY = (clientY - rect.top) * scaleY;

    let hitIndex = -1;
    for (let i = balls.length - 1; i >= 0; i--) {
      const ball = balls[i];
      const dx = mouseX - ball.x;
      const dy = mouseY - ball.y;
      if (Math.sqrt(dx * dx + dy * dy) <= ball.radius + 8) {
        hitIndex = i;
        break;
      }
    }

    if (hitIndex !== -1) {
      score += 1;
      scoreSpan.textContent = score;
      balls.splice(hitIndex, 1);
      stateMsg.textContent = '✨ +1';
      stateMsg.style.color = '#b8ffb0';
      setTimeout(function () {
        stateMsg.textContent = '🎯 捕捉光';
        stateMsg.style.color = '#ffda7c';
      }, 220);
    }
  }

  /* 电脑：点击 */
  canvas.addEventListener('click', function (e) {
    handlePoint(e.clientX, e.clientY);
  });

  /* 手机：触摸（响应更快，且阻止 300ms 延迟与页面滚动） */
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    handlePoint(t.clientX, t.clientY);
  }, { passive: false });

  function gameLoop(timestamp) {
    deltaTime = timestamp - lastTimestamp;
    lastTimestamp = timestamp;
    update(deltaTime);
    draw();
    animationId = requestAnimationFrame(gameLoop);
  }

  function resetGame() {
    if (animationId) cancelAnimationFrame(animationId);

    score = 0;
    timeLeft = GAME_DURATION;
    gameActive = true;
    gameOver = false;
    balls = [];
    spawnTimer = 0;
    countdownTimer = 0;

    scoreSpan.textContent = '0';
    timerSpan.textContent = GAME_DURATION;
    stateMsg.textContent = '🎯 捕捉光';
    stateMsg.style.color = '#ffda7c';

    const initialBalls = randomInt(2, 3);
    for (let i = 0; i < initialBalls; i++) {
      const ball = createBall();
      ball.bornAt = performance.now() - randomInt(0, 800);
      balls.push(ball);
    }

    lastTimestamp = performance.now();
    animationId = requestAnimationFrame(gameLoop);
  }

  restartBtn.addEventListener('click', resetGame);

  /* 横竖屏切换时，浏览器会重算尺寸，这里重新起一局避免坐标错位 */
  window.addEventListener('orientationchange', function () {
    setTimeout(resetGame, 150);
  });

  resetGame();
})();
</script>
</body>
</html>
