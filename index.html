<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>捕光者游戏入口</title>
    <script>
        (function(){
            // 增强判断：UA + 触摸硬件 + 视口宽度多重校验
            function isMobileDevice() {
                const ua = navigator.userAgent;
                const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
                // 硬件是否支持触摸（手机真实硬件一定有触摸点）
                const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                // 当前浏览器窗口宽度小
                const smallWindow = window.innerWidth <= 900;

                // 满足：(UA标记手机) 或者 (有触摸硬件并且窗口不大) →判定移动端
                return uaMobile || (hasTouch && smallWindow);
            }

            if(isMobileDevice()){
                location.href = "./ball-mobile.html";
            }else{
                location.href = "./ball.html";
            }
        })();
    </script>
</head>
<body>
    <div style="text-align:center;margin-top:4rem;color:#fff;background:#0b1025;padding:2rem;font-family:system-ui">
        <p>正在识别设备，正在跳转游戏……</p>
        <p>如果没有跳转，请手动选择：</p>
        <p><a href="./ball.html" style="color:#74a9ff">PC电脑版</a></p>
        <p><a href="./ball-mobile.html" style="color:#74a9ff">手机移动版</a></p>
    </div>
</body>
</html>
