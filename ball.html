<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 捕光者 · 星空小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #0a0f2a 0%, #030514 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-wrapper {
            background: rgba(18, 25, 55, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 1.5rem 2rem 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #5f7fff33, 0 0 30px #3b5bdb55;
            border: 1px solid #8ab2ff;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: radial-gradient(circle at 30% 30%, #1a2444, #0b1025);
            border-radius: 28px;
            box-shadow: inset 0 0 35px #00000066, 0 0 25px #3c5eff44;
            border: 2px solid #aac3ff;
            cursor: crosshair;
            width: 600px;
            height: 400px;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            padding: 0.4rem 1.2rem;
            background: #111a33d9;
            border-radius: 60px;
            border: 1px solid #6f8bff;
            color: #f0f6ff;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .score-box {
            background: #1e2f5e;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #d7e6ff;
            text-shadow: 0 0 12px #4a7dff;
            box-shadow: inset 0 2px 5px #00000055, 0 4px 10px #00000033;
        }
        .timer-box {
            background: #1a2749;
            padding: 0.3rem 1.8rem;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: inset 0 2px 5px #00000044;
        }
        .timer-icon {
            font-size: 1.6rem;
            line-height: 1;
        }
        .btn-restart {
            background: #2b3f7e;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #0d1730, 0 8px 15px #00000055;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #87a6ff;
        }
        .btn-restart:hover {
            background: #3e5ac0;
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #0d1730, 0 12px 20px #00000066;
        }
        .btn-restart:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0d1730;
        }
        .message {
            color: #ffda7c;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 0 8px #ffbb33aa;
            width: 90px;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 1rem;
            color: #7b92d9;
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="info-panel">
        <div class="score-box">
            <span id="scoreDisplay">0</span>
        </div>
        <div class="timer-box">
            <span class="timer-icon">⏳</span>
            <span id="timerDisplay">30</span>
        </div>
        <button class="btn-restart" id="restartBtn">⟳ 重启</button>
        <div id="stateMessage" class="message">🎯 捕捉光</div>
    </div>
    <footer>✨ 点击光球得分 · 时间归零结束 ✨</footer>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const timerSpan = document.getElementById('timerDisplay');
        const stateMsg = document.getElementById('stateMessage');
        const restartBtn = document.getElementById('restartBtn');

        const GAME_DURATION = 30;
        const BALL_RADIUS = 14;
        const MAX_BALLS = 5;
        const SPAWN_INTERVAL = 450;
        const BALL_LIFETIME = 4500;

        let score = 0;
        let timeLeft = GAME_DURATION;
        let gameActive = false;
        let gameOver = false;
        let balls = [];

        let lastTimestamp = 0;
        let deltaTime = 0;
        let spawnTimer = 0;
        let countdownTimer = 0;
        let animationId = null;

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createBall() {
            const x = randomInt(BALL_RADIUS + 2, canvas.width - BALL_RADIUS - 2);
            const y = randomInt(BALL_RADIUS + 2, canvas.height - BALL_RADIUS - 2);
            const hue = randomInt(0, 360);
            const color = `hsl(${hue}, 95%, 70%)`;
            const glowColor = `hsl(${hue}, 100%, 75%)`;
            return {
                x, y,
                radius: BALL_RADIUS,
                color: color,
                glow: glowColor,
                bornAt: performance.now(),
                phase: Math.random() * Math.PI * 2,
            };
        }

        function endGame() {
            gameActive = false;
            gameOver = true;
            stateMsg.textContent = '⏰ 时间到';
            stateMsg.style.color = '#ff6b6b';
        }

        function update(deltaMs) {
            if (!gameActive || gameOver) return;
            countdownTimer += deltaMs;
            if (countdownTimer >= 1000) {
                const secondsToSubtract = Math.floor(countdownTimer / 1000);
                timeLeft = Math.max(0, timeLeft - secondsToSubtract);
                countdownTimer -= secondsToSubtract * 1000;
                timerSpan.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                    return;
                }
            }
            spawnTimer += deltaMs;
            if (spawnTimer >= SPAWN_INTERVAL && balls.length < MAX_BALLS) {
                balls.push(createBall());
                spawnTimer -= SPAWN_INTERVAL;
            }
            const now = performance.now();
            balls = balls.filter(ball => (now - ball.bornAt) < BALL_LIFETIME);
        }

        function drawStars() {
            const starCount = 70;
            const now = performance.now();
            for (let i = 0; i < starCount; i++) {
                const seed = i * 17;
                const x = (seed * 13 % canvas.width + i * 29) % canvas.width;
                const y = (seed * 7 % canvas.height + i * 31) % canvas.height;
                const brightness = 0.4 + 0.6 * Math.abs(Math.sin(now * 0.001 + i));
                ctx.beginPath();
                ctx.arc(x, y, 1 + i % 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 200, ${brightness * 0.8})`;
                ctx.fill();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStars();
            const now = performance.now();
            for (let ball of balls) {
                const age = now - ball.bornAt;
                const lifeRatio = Math.max(0, 1 - age / BALL_LIFETIME);
                ctx.shadowColor = ball.glow;
                ctx.shadowBlur = 25 + 5 * Math.sin(now * 0.005 + ball.phase);
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius * (0.9 + 0.1 * Math.sin(now * 0.01 + ball.phase)), 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();

                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fill();

                ctx.shadowBlur = 12;
                ctx.strokeStyle = 'rgba(255,255,220,0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius + 2 + Math.sin(now * 0.008 + ball.phase) * 1.5, 0, Math.PI * 2);
                ctx.stroke();

                if (lifeRatio < 0.3) {
                    ctx.globalAlpha = lifeRatio * 3.5;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 28px "Segoe UI", sans-serif';
                ctx.fillStyle = '#f0d9ff';
                ctx.shadowColor = '#aa88ff';
                ctx.shadowBlur = 18;
                ctx.textAlign = 'center';
                ctx.fillText('✨ 游戏结束 ✨', canvas.width/2, canvas.height/2 - 20);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#cfd8ff';
                ctx.fillText(`得分: ${score}`, canvas.width/2, canvas.height/2 + 25);
                ctx.shadowBlur = 0;
            }
        }

        function handleCanvasClick(e) {
            if (!gameActive || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            let hitIndex = -1;
            for (let i = balls.length - 1; i >= 0; i--) {
                const ball = balls[i];
                const dx = mouseX - ball.x;
                const dy = mouseY - ball.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist <= ball.radius + 6) {
                    hitIndex = i;
                    break;
                }
            }
            if (hitIndex !== -1) {
                score += 1;
                scoreSpan.textContent = score;
                balls.splice(hitIndex, 1);
                stateMsg.textContent = '✨ +1';
                stateMsg.style.color = '#b8ffb0';
                setTimeout(()=>{
                    stateMsg.textContent = '🎯 捕捉光';
                    stateMsg.style.color = '#ffda7c';
                },220);
            }
        }

        function gameLoop(timestamp) {
            deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;
            update(deltaTime);
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            if (animationId) cancelAnimationFrame(animationId);
            score = 0;
            timeLeft = GAME_DURATION;
            gameActive = true;
            gameOver = false;
            balls = [];
            spawnTimer = 0;
            countdownTimer = 0;
            scoreSpan.textContent = '0';
            timerSpan.textContent = GAME_DURATION;
            stateMsg.textContent = '🎯 捕捉光';
            stateMsg.style.color = '#ffda7c';
            const initialBalls = randomInt(2, 3);
            for (let i = 0; i < initialBalls; i++) {
                const ball = createBall();
                ball.bornAt = performance.now() - randomInt(0, 800);
                balls.push(ball);
            }
            lastTimestamp = performance.now();
            animationId = requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', handleCanvasClick);
        restartBtn.addEventListener('click', resetGame);
        resetGame();
    })();
</script>
</body>
</html>
